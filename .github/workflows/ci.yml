name: CI

# pull_request (NOT pull_request_target): fork PRs run with a read-only
# GITHUB_TOKEN and no secrets — checked-out code is untrusted.
on:
  pull_request:
  push:
    branches: [master]
  # omp releases often: test the newest one weekly even when nothing is pushed.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Minimal token scope: the job only needs to read the checked-out code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel stale runs on PRs; master pushes keep their status per commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # latest: the omp users update to. minimum: the floor of the peer range
        # in package.json, read from there so no version is written here.
        omp: [latest, minimum]
    steps:
      # Actions pinned to commit SHAs so a retagged release cannot swap the
      # code this job runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest Bun: omp's engines.bun only rises, so a pinned one would
      # eventually fail to run the latest omp.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # --frozen-lockfile: the compiler and node types bun.lock pins. omp is not
      # in it: it is installed below, at the version this job tests.
      # --ignore-scripts: dependency postinstall code does not run in CI.
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Install omp (${{ matrix.omp }})
        run: |
          if [ "${{ matrix.omp }}" = minimum ]; then
            export OMP_VERSION=$(bun -e "console.log(require('./package.json').peerDependencies['@oh-my-pi/pi-coding-agent'].match(/\d+\.\d+\.\d+/)[0])")
          fi
          bun run setup:omp
          bun -e "import { VERSION } from '@oh-my-pi/pi-coding-agent'; console.log('omp', VERSION)"

      - run: bun run typecheck

      # The extension imports no omp package at runtime: it gets omp's functions
      # from pi.pi. Fail if a bundle with packages left external imports anything
      # but node builtins.
      - name: Runtime imports are node builtins only
        run: |
          bun build index.ts --target bun --packages external > /tmp/bundle.js
          if grep -E '^import .* from "[^"]+"' /tmp/bundle.js | grep -vE 'from "(node:)?(fs|path|os)"'; then
            echo "omp-vcc must not import packages at runtime" >&2
            exit 1
          fi

      - run: bun test
