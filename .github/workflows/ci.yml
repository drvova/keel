name: CI

# pull_request (NOT pull_request_target): fork PRs run with a read-only
# GITHUB_TOKEN and no secrets — checked-out code is untrusted.
on:
  pull_request:
  push:
    branches: [master]
  # omp and Pi release often: test the newest of each weekly even when nothing is pushed.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Minimal token scope: the job only needs to read the checked-out code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel stale runs on PRs; master pushes keep their status per commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # latest: the host users update to. minimum: the floor of its peer range
        # in package.json, read from there so no version is written here. Both
        # hosts are installed in every job (each entry's types read both); the
        # one at its floor is the one the job is about.
        include:
          - { omp: latest, pi: latest }
          - { omp: minimum, pi: latest }
          - { omp: latest, pi: minimum }
    steps:
      # Actions pinned to commit SHAs so a retagged release cannot swap the
      # code this job runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest Bun: omp's engines.bun only rises, so a pinned one would
      # eventually fail to run the latest omp.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # --frozen-lockfile: the compiler and node types bun.lock pins. The hosts
      # are not in it: they are installed below, at the versions this job tests.
      # --ignore-scripts: dependency postinstall code does not run in CI.
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Install omp (${{ matrix.omp }})
        run: |
          if [ "${{ matrix.omp }}" = minimum ]; then
            export OMP_VERSION=$(bun -e "console.log(require('./package.json').peerDependencies['@oh-my-pi/pi-coding-agent'].match(/\d+\.\d+\.\d+/)[0])")
          fi
          bun run setup:omp

      - name: Install Pi (${{ matrix.pi }})
        run: |
          if [ "${{ matrix.pi }}" = minimum ]; then
            export PI_VERSION=$(bun -e "console.log(require('./package.json').peerDependencies['@earendil-works/pi-coding-agent'].match(/\d+\.\d+\.\d+/)[0])")
          fi
          bun run setup:pi

      # Both hosts load after both installs (one npm install must not prune the other).
      - name: Host versions
        run: |
          bun -e "import { VERSION } from '@oh-my-pi/pi-coding-agent'; console.log('omp', VERSION)"
          bun -e "import { VERSION } from '@earendil-works/pi-coding-agent'; console.log('pi', VERSION)"

      # The Lisp core (lisp/): Ubuntu's SBCL builds it, its own tests run, and
      # bun run test below builds the executable, which every test runs on, in
      # real omp and Pi too.
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sbcl
      - name: Lisp core tests
        run: sbcl --noinform --non-interactive --eval '(require :asdf)' --eval '(push (truename "lisp/") asdf:*central-registry*)' --eval '(asdf:test-system "keel-core")'
      # Every warning SBCL's compiler raises, and functions nothing names.
      - name: Lisp lint
        run: sbcl --noinform --non-interactive --load lisp/lint.lisp

      - run: bun run typecheck

      # The shared code imports no package at runtime, omp's included: the omp
      # entry gets omp's functions from pi.pi, and the Pi entry imports only Pi's
      # own package, which Pi's loader resolves to the running Pi. Fail if a
      # bundle with packages left external imports anything else, statically or
      # dynamically, but node builtins.
      - name: Runtime imports are node builtins (and Pi's own package in pi.ts)
        run: |
          check() {
            bun build "$1" --target bun --packages external > /tmp/bundle.js
            ALLOWED="$2" bun -e '
              const extra = (process.env.ALLOWED ?? "").split(",").filter(Boolean);
              const builtin = new Set(require("node:module").builtinModules);
              const allowed = (p) => builtin.has(p.replace(/^node:/, "")) || extra.includes(p);
              const found = new Bun.Transpiler({ loader: "js" }).scanImports(await Bun.file("/tmp/bundle.js").text());
              const bad = [...new Set(found.map((i) => i.path).filter((p) => !allowed(p)))];
              if (bad.length) { console.error("keel must not import packages at runtime:", bad.join(", ")); process.exit(1); }
            '
          }
          check index.ts ""
          check pi.ts "@earendil-works/pi-coding-agent"

      # Each file in a fresh module registry: omp answers Pi's package names once it is loaded (tests/support/pi.ts).
      # Every test runs on the core, which the preload builds (tests/support/core-on.ts).
      - run: bun run test
